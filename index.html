    "closingTitle": "TESLİM OLMADIK, ASLA OLMAYACAĞIZ!",
    "closingText": "189. BÖLGEYE ÇAĞRIMIZ\nMevcut NAP-10/12 üyelerinin eşitlik yerine ayrıcalıklarını korumak istediğini düşünüyoruz. CopStars (CPS), güçlü oyuncuları, ittifak liderlerini ve adil oyun taraftarlarını yeni SR-189 birliğine katılmaya çağırıyor. Ortak kuralları, açık tartışmayı, ortak kararları, adil dağıtımı ve ittifak seçme özgürlüğünü savunuyoruz.\n707 ittifakının yayılmasına verilen desteğin sona ermesini ve adil kuralları kabul edene kadar oyun içinde diplomatik olarak izole edilmesini istiyoruz. Hiçbir ittifak sunucunun kaderini tek başına belirlememelidir. Açıklık, demokrasi ve eşitlik egemen olmalıdır.\nBizi yok etmeye çalıştılar, başaramadılar ve asla başaramayacaklar! Birlikte daha güçlü olacağız. Diyaloğa hazırız, boyun eğmeye değil. 707 ya adil koşulları kabul etmeli ya da hâkimiyetini sona erdirmeye, gerekirse ittifakın dağılmasına yönelik birleşik oyun içi mücadeleyle karşılaşmalıdır. Görüşünüzü açıklamaktan korkmayın. Güçlü ittifaklara değil, gücün kötüye kullanılmasına karşıyız.\n\nGÜCÜMÜZ BİRLİK, HEDEFİMİZ ADALET!\nTEK BÖLGE. ORTAK KURALLAR. ORTAK ZAFER."

    "intro": "우리의 입장\nCPS는 189 지역의 공정한 게임, 평등, 건전한 경쟁을 지지합니다. 우리는 707 동맹의 세력 확장과 상위 동맹의 특권층에 유리하다고 판단하는 현행 NAP-10/12 규칙에 반대합니다. 지역은 모든 플레이어의 것입니다. 누구나 성장하고 동맹을 선택하며 자유롭게 의견을 표현할 권리가 있습니다.\n\n우리의 공동 상대는 다른 서버입니다\n많은 플레이어가 의견을 밝히기를 두려워하고, 일부는 전쟁을 원하지 않습니다. Police Chief는 농장 게임이 아니라 전투, 전략, 협동의 게임입니다. 내부 전쟁으로 전력을 소모하지 말고 다른 서버와의 전투에 집중해야 합니다. 내부 경쟁은 지역을 강화해야 합니다.\n\nNAP와 서버 규칙\nNAP(Non-Aggression Pact)는 상위 동맹 간 내부 전쟁을 방지하고 전력을 보존하며 서버 간 전투를 준비하기 위한 불가침 협정입니다. 우리는 현행 NAP-10/12가 소수 동맹의 이익을 위한 서버 통치 수단으로 변질되었다고 생각합니다.\nNAP는 불가침 협정이지 통치 기관이 아닙니다! 가입을 이유로 일방적인 규칙 제정, 전략 시설 독점, 아카데미 특혜 또는 공개 논의 없는 권리 제한이 허용되어서는 안 됩니다.\n\nSR-189 — 서버 공동 규칙\nCPS는 전력, 규모, 국적, 언어, 순위와 관계없이 모든 플레이어에게 적용되는 공동 규칙을 제안합니다. 원칙은 공개성, 투명성, 민주적 의사 결정, 규칙 앞의 평등, 공정한 경쟁과 전략 시설 배분, 공동 책임, 서버 간 승리 우선입니다.\nNAP-10은 SR-189 내에서 상위 동맹 간 불가침 협정으로만 존재할 수 있습니다. 다른 관계는 서버 공동 규칙에 따릅니다. NAP가 서버 규칙을 정하는 것이 아니라 서버 규칙이 NAP의 조건을 정해야 합니다!\n\nSR-189 주요 규칙",

      [
        "자원 타일 보호",

    "closingTitle": "우리는 항복하지 않았으며 앞으로도 항복하지 않을 것입니다!",
    "closingText": "189 지역 플레이어 여러분께\n현행 NAP-10/12 회원들은 평등보다 특권 유지에 관심이 있다고 생각합니다. CopStars (CPS)는 강한 플레이어, 동맹 지도자와 공정한 게임을 지지하는 모든 분에게 새로운 SR-189 연합에 참여할 것을 요청합니다. 공동 규칙, 공개 토론, 공동 결정, 공정한 시설 배분과 동맹 선택의 자유를 지지합니다.\n707 동맹의 확장 정책에 대한 지지를 중단하고 공정한 공동 규칙을 수용할 때까지 게임 내에서 외교적으로 고립시킬 것을 촉구합니다. 어느 동맹도 서버의 운명을 독단적으로 결정해서는 안 됩니다. 공개성, 민주주의와 평등이 우선되어야 합니다.\n그들은 우리 동맹을 무너뜨리려 했지만 실패했습니다. 앞으로도 성공하지 못할 것입니다! 여러분과 함께라면 더 강해질 것입니다. 대화에는 열려 있지만 복종하지는 않습니다. 707은 공정한 조건을 받아들이거나 패권 종식과 필요시 동맹 해체를 목표로 하는 게임 내 연합 저항에 직면해야 합니다. 의견을 밝히기를 두려워하지 마십시오. 우리는 강한 동맹이 아니라 힘의 남용에 반대합니다.\n\n우리의 힘은 단결! 우리의 목표는 공정함!\n하나의 지역. 공동 규칙. 공동 승리."

  "de": {
    "subtitle": "REGION 189 – FÜR FAIRPLAY!",
    "intro": "UNSERE POSITION\nCPS steht für Fairplay, Gleichberechtigung und gesunden Wettbewerb in Region 189. Wir lehnen die Expansion der Allianz 707 und die derzeitigen NAP-10/12-Regeln ab, die unserer Ansicht nach vor allem den privilegierten Spielern der führenden Allianzen dienen. Die Region gehört allen Spielern. Jeder soll sich entwickeln, seine Allianz frei wählen und seine Meinung äußern können.\n\nUNSER GEMEINSAMER GEGNER IST EIN ANDERER SERVER\nViele Spieler fürchten sich, ihre Meinung zu äußern; andere wollen nicht kämpfen. Police Chief ist keine Landwirtschaftssimulation, sondern ein Spiel der Kämpfe, Strategie und Teamarbeit. Unsere Kampfkraft sollte sich gegen andere Server richten, statt durch interne Kriege erschöpft zu werden. Interner Wettbewerb soll unsere Region stärken.\n\nNAP UND SERVERREGELN\nNAP (Non-Aggression Pact) ist ein Nichtangriffspakt zwischen führenden Allianzen, um interne Kriege zu verhindern, Kampfkraft zu erhalten und serverübergreifende Kämpfe vorzubereiten. Unserer Ansicht nach verfälscht das aktuelle NAP-10/12 diesen Zweck und macht den Pakt zu einem Herrschaftsinstrument zugunsten weniger Allianzen.\nNAP ist ein Nichtangriffspakt, kein Regierungsorgan! Die Mitgliedschaft darf nicht dazu berechtigen, einseitig Regeln festzulegen, strategische Einrichtungen zu monopolisieren, Akademien zu privilegieren oder andere Spieler ohne offene Diskussion einzuschränken.\n\nSR-189 – SERVER RULES 189\nCPS schlägt gemeinsame Regeln für alle vor, unabhängig von Stärke, Größe, Nationalität, Sprache oder Rang. Unsere Grundsätze sind Offenheit, Transparenz, demokratische Entscheidungen, Gleichheit vor den Regeln, fairer Wettbewerb, gerechte Verteilung strategischer Einrichtungen, gemeinsame Verantwortung und Vorrang serverübergreifender Siege.\nNAP-10 darf innerhalb von SR-189 ausschließlich als Nichtangriffspakt der führenden Allianzen bestehen. Alle übrigen Beziehungen unterliegen den Serverregeln. Die Serverregeln müssen den NAP bestimmen, nicht umgekehrt!\n\nHAUPTREGELN VON SR-189",

    "closingTitle": "WIR HABEN NICHT KAPITULIERT UND WERDEN ES NIE TUN!",
    "closingText": "AUFRUF AN REGION 189\nWir glauben, dass die derzeitigen NAP-10/12-Mitglieder ihre Privilegien bewahren wollen, statt Gleichberechtigung zu akzeptieren. Wir lehnen diese Ordnung ab. CopStars (CPS) ruft führende Spieler, Allianzleiter und alle Anhänger des Fairplays auf, sich der neuen SR-189-Koalition anzuschließen und gemeinsame Regeln, offene Diskussionen, gemeinsame Entscheidungen, gerechte Verteilung und freie Allianzwahl zu unterstützen.\nWir fordern ein Ende der Unterstützung für die Expansion der Allianz 707 und ihre diplomatische Isolation innerhalb des Spiels, bis sie faire gemeinsame Regeln akzeptiert. Keine Allianz darf die Zukunft des Servers diktieren. Offenheit, Demokratie und Gleichberechtigung müssen Vorrang haben.\nSie versuchten uns zu vernichten und scheiterten. Sie werden niemals Erfolg haben! Gemeinsam werden wir stärker. Wir sind zum Dialog bereit, nicht zur Unterwerfung, und zur Zusammenarbeit auf Augenhöhe. Allianz 707 muss faire Bedingungen akzeptieren oder sich vereintem Widerstand im Spiel gegen ihre Vorherrschaft bis hin zur Auflösung der Allianz stellen. Äußert eure Meinung. Wir sind gegen Machtmissbrauch, nicht gegen starke Allianzen.\n\nUNSERE STÄRKE IST EINHEIT! UNSER ZIEL IST GERECHTIGKEIT!\nEINE REGION. GEMEINSAME REGELN. EIN GEMEINSAMER SIEG."

  "fr": {
    "subtitle": "RÉGION 189 — POUR LE FAIR-PLAY !",
    "intro": "NOTRE POSITION\nCPS défend le fair-play, l’égalité et une saine compétition dans la région 189. Nous nous opposons à l’expansion de l’alliance 707 et aux règles actuelles du NAP-10/12 qui, selon nous, servent surtout les joueurs privilégiés des alliances dominantes. La région appartient à tous ses joueurs. Chacun doit pouvoir progresser, choisir son alliance et exprimer son opinion.\n\nNOTRE ADVERSAIRE COMMUN EST UN AUTRE SERVEUR\nDe nombreux joueurs craignent de s’exprimer ; d’autres ne veulent pas combattre. Police Chief n’est pas un simulateur agricole, mais un jeu de combat, de stratégie et de coopération. Notre puissance militaire doit être dirigée contre les autres serveurs plutôt que gaspillée dans des guerres internes. La compétition interne doit renforcer notre région.\n\nNAP ET RÈGLES DU SERVEUR\nLe NAP (Non-Aggression Pact) est un pacte de non-agression entre les principales alliances visant à prévenir les guerres internes, préserver leur puissance militaire et préparer les combats interserveurs. Selon nous, le NAP-10/12 actuel détourne cet objectif en devenant un instrument de domination au profit de quelques alliances.\nLe NAP est un pacte de non-agression, pas un organe de gouvernement ! L’adhésion ne doit pas permettre d’imposer unilatéralement des règles, de monopoliser les installations stratégiques, d’accorder des privilèges aux académies ou de restreindre les autres joueurs sans débat ouvert.\n\nSR-189 — SERVER RULES 189\nCPS propose des règles communes à tous, indépendamment de la puissance, de la taille, de la nationalité, de la langue ou du classement. Nos principes sont l’ouverture, la transparence, la prise de décision démocratique, l’égalité devant les règles, la compétition équitable, la répartition équitable des installations stratégiques, la responsabilité collective et la priorité aux victoires interserveurs.\nLe NAP-10 ne peut exister dans le cadre du SR-189 que comme pacte de non-agression entre les principales alliances. Toutes les autres relations relèvent des règles du serveur. Les règles du serveur doivent définir le NAP, et non l’inverse !\n\nRÈGLES PRINCIPALES DU SR-189",
    "sections": [
      [
        "PROTECTION DES CASES DE RESSOURCES",
        "Il est interdit d’attaquer les joueurs qui collectent des ressources, quelle que soit leur alliance ou leur zone de collecte. Seuls les événements officiels d’élimination de troupes font exception : ces attaques sont alors autorisées pour tous."
      ],

      ],

        "UNITÉ DES PRINCIPALES ALLIANCES",

      [

    "closingTitle": "NOUS N’AVONS PAS CAPITULÉ ET NE CAPITULERONS JAMAIS !",
    "closingText": "APPEL AUX JOUEURS DE LA RÉGION 189\nNous estimons que les membres actuels du NAP-10/12 cherchent à préserver leurs privilèges plutôt qu’à accepter l’égalité. Nous rejetons cet ordre. CopStars (CPS) appelle les meilleurs joueurs, les chefs d’alliance et les partisans du fair-play à rejoindre la nouvelle coalition SR-189 et à soutenir les règles communes, le débat ouvert, les décisions collectives, la répartition équitable et la liberté de choisir son alliance.\nNous appelons à cesser de soutenir l’expansion de l’alliance 707 et à l’isoler diplomatiquement dans le jeu jusqu’à ce qu’elle accepte des règles communes équitables. Aucune alliance ne doit dicter l’avenir du serveur. L’ouverture, la démocratie et l’égalité doivent prévaloir.\nIls ont essayé de nous détruire et ont échoué. Ils n’y parviendront jamais ! Ensemble, nous serons plus forts. Nous sommes prêts au dialogue, pas à la soumission, et à une coopération sur un pied d’égalité. L’alliance 707 doit accepter des conditions équitables ou faire face à une opposition unie dans le jeu visant à mettre fin à sa domination, jusqu’à sa dissolution. Exprimez votre opinion. Nous combattons les abus de pouvoir, pas les alliances fortes.\n\nNOTRE FORCE EST L’UNITÉ ! NOTRE OBJECTIF EST LA JUSTICE !\nUNE RÉGION. DES RÈGLES COMMUNES. UNE VICTOIRE COMMUNE."

function setLanguage(lang) {
  if (!translations[lang]) lang = "en";
  const t = translations[lang];
  document.documentElement.lang = lang;
  const labels = {ru: ["АЛЬЯНС COPSTARS (CPS)", "Единые правила сервера"], en: ["COPSTARS (CPS) ALLIANCE", "Server Rules"], tr: ["COPSTARS (CPS) İTTİFAKI", "Ortak Sunucu Kuralları"], ko: ["COPSTARS (CPS) 동맹", "서버 공통 규칙"], de: ["ALLIANZ COPSTARS (CPS)", "Gemeinsame Serverregeln"], ja: ["COPSTARS (CPS) 同盟", "サーバー共通ルール"], fr: ["ALLIANCE COPSTARS (CPS)", "Règles communes du serveur"]};
  document.getElementById("allianceName").textContent = labels[lang][0];
  document.getElementById("rulesName").textContent = labels[lang][1];
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("closingTitle").textContent = t.closingTitle;
  document.getElementById("closingText").textContent = t.closingText;

  const container = document.getElementById("sections");
  container.replaceChildren();
  t.sections.forEach(([title, content], i) => {
    const section = document.createElement("section");
    section.className = "section";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = String(i + 1).padStart(2, "0");

    const heading = document.createElement("h2");
    heading.textContent = title;

    const paragraph = document.createElement("p");
    paragraph.textContent = content;

    section.append(number, heading, paragraph);
    container.append(section);
  });

  document.querySelectorAll("[data-lang]").forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  try { localStorage.setItem("cps-language", lang); } catch(e) {}
}

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

let savedLanguage;
try { savedLanguage = localStorage.getItem("cps-language"); } catch(e) {}
const browserLanguage = navigator.language.split("-")[0].toLowerCase();
setLanguage(savedLanguage || browserLanguage);
</script>
