<head>

<meta name="theme-color" content="#0b101b">
<meta name="description" content="Official CopStars (CPS) alliance manifesto — Police Chief">
<title>CopStars (CPS) | Alliance Manifesto</title>
<style>
:root {
  --bg: #0b101b;

  --gold: #d4af37;
  --text: #f2f3f5;

* { box-sizing: border-box; }
body {

  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans", sans-serif;
  line-height: 1.75;
}
header {

  padding: 45px 18px 30px;
  background: linear-gradient(180deg,#1c2639,#0b101b);

.logo {
  width: 90px;
  height: 90px;
  margin: auto;

  border: 2px solid var(--gold);
  border-radius: 50%;
  font-size: 30px;
  font-weight: 900;
  color: var(--gold);
  box-shadow: 0 0 35px #d4af3725;
}
.eyebrow {
  color: var(--gold);
  letter-spacing: 3px;
  font-size: 11px;
  margin-top: 20px;
}
h1 {

  margin: 12px 0;
  letter-spacing: 2px;
}
.subtitle {
  color: var(--muted);
  max-width: 650px;
  margin: auto;
}
.languages {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 28px;
}
.languages button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 10px 15px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
}
.languages button.active {
  border-color: var(--gold);
  color: var(--gold);
  background: #342c19;
}
main {
  max-width: 820px;
  margin: auto;
  padding: 20px 18px 65px;
}
.intro {
  font-size: 16px;
  padding: 22px 0;
  white-space: pre-line;
}
.section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  padding: 24px;
  margin: 18px 0;
  border-radius: 8px;
}
.number {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 2px;
}
h2 {
  color: var(--gold);
  font-size: 19px;
  line-height: 1.4;
  margin: 10px 0;
}
.section p {
  margin: 0;
  white-space: pre-line;
}
.closing {
  text-align: center;
  padding: 35px 15px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
.closing h2 {
  font-size: clamp(22px,5vw,32px);
}
footer {
  text-align: center;
  color: var(--muted);
  padding: 25px;
  border-top: 1px solid var(--border);
  font-size: 12px;
}
@media(max-width:600px) {
  header { padding-top: 30px; }
  .section { padding: 18px; }
  .languages button { padding: 9px 11px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">CPS</div>
  <div class="eyebrow">POLICE CHIEF • OFFICIAL STATEMENT</div>
  <h1>COPSTARS</h1>
  <div class="subtitle" id="subtitle"></div>
  <div class="languages">
    <button data-lang="en">🇬🇧 EN</button>
    <button data-lang="ru">🇷🇺 RU</button>
    <button data-lang="tr">🇹🇷 TR</button>
    <button data-lang="ko">🇰🇷 KO</button>

</header>

<main>

  <div id="sections"></div>
  <div class="closing">

<footer>
  COPSTARS (CPS) • POLICE CHIEF<br>
  UNITY • STRENGTH • FAIRNESS

function setLanguage(lang) {
  if (!translations[lang]) lang = "en";
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("closingTitle").textContent = t.closingTitle;
  document.getElementById("closingText").textContent = t.closingText;

  const container = document.getElementById("sections");
  container.replaceChildren();
  t.sections.forEach(([title, content], i) => {
    const section = document.createElement("section");
    section.className = "section";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = String(i + 1).padStart(2, "0");

    const heading = document.createElement("h2");
    heading.textContent = title;

    const paragraph = document.createElement("p");
    paragraph.textContent = content;

    section.append(number, heading, paragraph);
    container.append(section);
  });

  document.querySelectorAll("[data-lang]").forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  try { localStorage.setItem("cps-language", lang); } catch(e) {}
}

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

let savedLanguage;
try { savedLanguage = localStorage.getItem("cps-language"); } catch(e) {}
const browserLanguage = navigator.language.split("-")[0].toLowerCase();
setLanguage(savedLanguage || browserLanguage);
